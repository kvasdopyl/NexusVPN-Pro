name: build-windows

# Every change pushed to main (including files uploaded through the GitHub website) produces a new
# release with an installer. Installed copies of NexusVPN Pro find it and offer to update.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".gitignore"

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q tests

      - name: Stamp build number
        id: ver
        shell: pwsh
        run: |
          $v = python tools/make_build_info.py ${{ github.run_number }} ${{ github.repository }}
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Build NexusVPN Pro.exe
        run: pyinstaller --noconfirm --clean NexusVPN.spec

      - name: Bundle cores and rule bases
        shell: pwsh
        run: |
          New-Item -ItemType File -Force portable.flag | Out-Null
          python -c "from nexusvpn import cores, paths; paths.ensure_dirs(); [print(n, cores.install(n, [None])) for n in cores.SPECS]; print(cores.update_rules([None]))"
          Remove-Item portable.flag
          $dst = "dist/NexusVPN Pro"
          Copy-Item -Recurse data/cores "$dst/cores"
          New-Item -ItemType Directory -Force "$dst/rules" | Out-Null
          Copy-Item data/rules/*.srs "$dst/rules/"
          Remove-Item -Force -ErrorAction SilentlyContinue "$dst/_internal/PySide6/opengl32sw.dll"
          Get-ChildItem "$dst/_internal/PySide6/translations" -File | Where-Object { $_.Name -notlike "*_ru.qm" } | Remove-Item -Force

      - name: Build installer
        shell: pwsh
        run: |
          function Find-Iscc { Get-ChildItem "$env:ProgramFiles\Inno Setup *\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName }
          $iscc = Find-Iscc
          if (-not $iscc) { choco install innosetup -y --no-progress | Out-Null; $iscc = Find-Iscc }
          Write-Host "Using $iscc"
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=..\dist\NexusVPN Pro" installer\NexusVPN.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer_out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusVPN-Pro-Setup-${{ steps.ver.outputs.version }}
          path: installer_out/*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: NexusVPN Pro ${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            Скачайте **NexusVPN-Pro-Setup-${{ steps.ver.outputs.version }}.exe** и запустите — программа установится,
            появятся значки на рабочем столе и в меню «Пуск». Уже установленная программа обновится сама.

            Изменение: ${{ github.event.head_commit.message || 'ручной запуск сборки' }}
          files: installer_out/*.exe
